name: Build TGX
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build"
        required: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Write config
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "telegram.api_id=${{ secrets.TG_API_ID }}" >> local.properties
          echo "telegram.api_hash=${{ secrets.TG_API_HASH }}" >> local.properties
      - run: scripts/setup.sh
      - run: ./gradlew assembleUniversalDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tgx-apk
          path: app/build/outputs/apk/**/*.apk
