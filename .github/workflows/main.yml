name: Build TGX
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build"
        required: true
      java_version:
        description: "JDK version (21 for v0.28.x, 25 for v0.29+)"
        required: false
        default: "21"
      gradle_args:
        description: "Gradle arguments"
        required: false
        default: "assembleUniversalDebug"
      sign_release:
        description: "Generate a signing keystore (needed for release builds)"
        required: false
        default: "false"
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TGX-Android/Telegram-X
          ref: ${{ inputs.ref }}
          submodules: recursive
      - name: Pull Git LFS files in submodules
        run: |
          git lfs install --skip-repo
          git lfs pull
          git submodule foreach --recursive 'git lfs pull'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
      - name: Write config
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "telegram.api_id=${{ secrets.TG_API_ID }}" >> local.properties
          echo "telegram.api_hash=${{ secrets.TG_API_HASH }}" >> local.properties
      - name: Create signing keystore
        if: ${{ inputs.sign_release == 'true' }}
        run: |
          KS_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$KS_PASS"
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias tgx \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=TGX, O=TGX, C=US"
          {
            echo "keystore.file=$RUNNER_TEMP/release.jks"
            echo "keystore.password=$KS_PASS"
            echo "key.alias=tgx"
            echo "key.password=$KS_PASS"
          } > "$RUNNER_TEMP/keystore.properties"
          echo "keystore.file=$RUNNER_TEMP/keystore.properties" >> local.properties
      - run: scripts/setup.sh
        env:
          TERM: xterm
      - run: ./gradlew $GRADLE_ARGS
        env:
          GRADLE_ARGS: ${{ inputs.gradle_args }}
      - uses: actions/upload-artifact@v4
        with:
          name: tgx-apk
          path: app/build/outputs/apk/**/*.apk
